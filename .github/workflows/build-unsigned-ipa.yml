name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build OpenCode Mobile IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Show environment
        run: |
          set -e
          echo "macOS:"
          sw_vers
          echo ""
          echo "Xcode:"
          xcodebuild -version
          echo ""
          echo "Node:"
          node --version
          echo ""
          echo "npm:"
          npm --version

      - name: Install JavaScript dependencies
        run: |
          set -e
          npm ci

      - name: Generate native iOS project
        run: |
          set -e
          npx expo prebuild \
            --platform ios \
            --clean \
            --no-install

      - name: Install CocoaPods dependencies
        run: |
          set -e
          cd ios
          pod install --repo-update

      - name: Detect Xcode workspace and scheme
        id: ios
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find "$GITHUB_WORKSPACE/ios" \
            -maxdepth 1 \
            -type d \
            -name "*.xcworkspace" \
            -print \
            -quit)"

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No Xcode workspace found."
            find "$GITHUB_WORKSPACE/ios" -maxdepth 2 -print
            exit 1
          fi

          echo "Workspace found:"
          echo "$WORKSPACE"

          LIST_JSON="$RUNNER_TEMP/xcode-list.json"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -list \
            -json \
            > "$LIST_JSON"

          cat "$LIST_JSON"

          SCHEME="$(python3 - "$LIST_JSON" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          schemes = []

          if isinstance(data.get("workspace"), dict):
              schemes += data["workspace"].get("schemes", [])

          if isinstance(data.get("project"), dict):
              schemes += data["project"].get("schemes", [])

          schemes = [
              s for s in schemes
              if s and
              "Pods-" not in s and
              not s.endswith("Tests") and
              not s.endswith("UITests")
          ]

          if not schemes:
              raise SystemExit("No usable iOS application scheme found.")

          print(schemes[0])
          PY
          )"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Scheme detection failed."
            exit 1
          fi

          echo "Scheme found:"
          echo "$SCHEME"

          {
            echo "workspace=$WORKSPACE"
            echo "scheme=$SCHEME"
          } >> "$GITHUB_OUTPUT"

      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          DERIVED_DATA="$RUNNER_TEMP/OpenCodeMobileDerivedData"

          rm -rf "$DERIVED_DATA"

          xcodebuild \
            -workspace "${{ steps.ios.outputs.workspace }}" \
            -scheme "${{ steps.ios.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find built application
        id: app
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/OpenCodeMobileDerivedData/Build/Products"

          APP_PATH="$(find "$PRODUCTS" \
            -type d \
            -path "*Release-iphoneos*" \
            -name "*.app" \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No iPhone .app bundle was produced."
            find "$PRODUCTS" -maxdepth 4 -print || true
            exit 1
          fi

          echo "Application found:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify iPhone build
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.app_path }}"
          PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist is missing."
            exit 1
          fi

          EXECUTABLE="$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST")"

          BINARY="$APP_PATH/$EXECUTABLE"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Main executable is missing:"
            echo "$BINARY"
            exit 1
          fi

          echo "Application:"
          echo "$APP_PATH"

          echo ""
          echo "Executable:"
          echo "$EXECUTABLE"

          echo ""
          echo "Binary type:"
          file "$BINARY"

          echo ""
          echo "Architectures:"
          ARCHS="$(lipo -archs "$BINARY")"
          echo "$ARCHS"

          if ! echo "$ARCHS" | tr ' ' '\n' | grep -qx "arm64"; then
            echo "ERROR: arm64 architecture was not found."
            exit 1
          fi

          SDK_NAME="$(xcrun dwarfdump --uuid "$BINARY" >/dev/null 2>&1 && echo "iphoneos")"

          if [ "$SDK_NAME" != "iphoneos" ]; then
            echo "ERROR: Device build verification failed."
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST")"

          VERSION="$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST" 2>/dev/null || echo unknown)"

          echo ""
          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Version:"
          echo "$VERSION"

          echo ""
          echo "Verification successful: iphoneos arm64 build."

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.app_path }}"

          DIST="$GITHUB_WORKSPACE/dist"
          PAYLOAD="$DIST/Payload"

          rm -rf "$DIST"
          mkdir -p "$PAYLOAD"

          APP_NAME="$(basename "$APP_PATH")"

          /usr/bin/ditto \
            "$APP_PATH" \
            "$PAYLOAD/$APP_NAME"

          cd "$DIST"

          /usr/bin/zip \
            -qry \
            -y \
            "OpenCodeMobile-unsigned.ipa" \
            "Payload"

          if [ ! -s "OpenCodeMobile-unsigned.ipa" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "IPA created:"
          ls -lh "OpenCodeMobile-unsigned.ipa"

      - name: Verify IPA package
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/dist/OpenCodeMobile-unsigned.ipa"

          unzip -t "$IPA"

          CONTENTS="$(unzip -Z1 "$IPA")"

          echo "$CONTENTS" | head -100

          if ! echo "$CONTENTS" | grep -q '^Payload/.*\.app/Info\.plist$'; then
            echo "ERROR: IPA does not contain Payload/*.app/Info.plist"
            exit 1
          fi

          echo ""
          echo "IPA verification successful."
          echo "Final file:"
          echo "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: dist/OpenCodeMobile-unsigned.ipa
          archive: false

      - name: Upload Xcode log if build failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
